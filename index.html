<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>Neon Duel – 1v1</title>
<style>
:root{--bg:#0d1424;--fg:#e6edf9;--cy:#39d5ff;--or:#ff7a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-weight:700;text-shadow:0 2px 6px #000;display:none}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:var(--fg);opacity:.9}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#cross.hit:before,#cross.hit:after{background:var(--or)}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 150px 40px rgba(255,40,40,.7);opacity:0;transition:opacity .3s}
#sc{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:26px;direction:ltr;letter-spacing:2px}
#sc small{font-size:13px;display:block;text-align:center;opacity:.7;letter-spacing:0}
.bl{position:absolute;bottom:18px;left:18px;direction:ltr}
#hp{width:230px;height:12px;background:#0007;border:1px solid #fff4;border-radius:6px;overflow:hidden}
#hpf{height:100%;width:100%;background:var(--cy);transition:width .15s}
#ammo{font-size:32px;margin-top:6px}
#big{position:absolute;top:32%;width:100%;text-align:center;font-size:64px;color:var(--cy)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(9,13,24,.88);text-align:center;gap:10px}
#ov h1{font-size:48px;margin:0;color:var(--cy);letter-spacing:1px}
#ov p{margin:2px;opacity:.85;line-height:1.6;max-width:480px;padding:0 16px}
#ov button,#ov input{font:inherit;font-size:19px;padding:11px 26px;border-radius:8px;border:2px solid var(--cy);background:transparent;color:var(--fg);cursor:pointer}
#ov button.p{background:var(--cy);color:#06121c;font-weight:700}
#ov input{width:120px;text-align:center;text-transform:lowercase;cursor:text;direction:ltr}
#code{font-size:54px;letter-spacing:8px;color:var(--or);direction:ltr;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#err{color:var(--or);min-height:24px}

#cheatPanel{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);direction:rtl}
.cheatCard{width:min(360px,88vw);padding:26px;border:2px solid #00ff44;border-radius:14px;background:#0b1510;box-shadow:0 0 35px rgba(0,255,68,.25);text-align:center;font-family:system-ui,Arial;color:#fff}
.cheatCard h2{margin:0 0 8px;color:#00ff44;letter-spacing:2px}.cheatCard p{opacity:.8}
.cheatCard input{width:150px;padding:12px;border:1px solid #00ff44;border-radius:8px;background:#071009;color:#fff;text-align:center;font-size:24px;letter-spacing:8px;direction:ltr;outline:none}
.cheatCard button{display:block;width:180px;margin:14px auto 0;padding:10px;border:0;border-radius:8px;background:#00ff44;color:#061006;font-weight:800;cursor:pointer;font-size:16px}
.cheatCard .cheatClose{background:#26332a;color:#fff}.cheatCard #cheatMsg{min-height:24px;margin-top:10px}.cheatCard #cheatMsg.ok{color:#00ff44}.cheatCard #cheatMsg.bad{color:#ff5050}
</style>
</head>
<body>
<div id="hud"><div id="vig"></div><div id="cross"></div>
<div id="sc"><span id="me">0</span> : <span id="op">0</span><small>ראשון ל-10 הריגות</small></div>
<div id="big"></div>
<div class="bl"><div id="hp"><div id="hpf"></div></div><div id="ammo">30</div></div></div>
<div id="ov">
 <h1>NEON DUEL</h1>
 <div id="body">
  <p>דו-קרב 1 על 1 אונליין. עובד מכל מקום: המארח מקבל קוד קצר ושולח אותו ליריב, היריב מקליד אותו, וזהו.</p>
  <div class="row" style="margin-top:14px"><button class="p" id="bh">פתח חדר</button><button id="bj">הצטרף לחדר</button></div>
  <p style="font-size:14px;margin-top:14px">WASD · עכבר · קליק ירי (החזק לרסס) · קליק ימני כיוון · R טעינה · Ctrl / C התכופפות · Shift ריצה · רווח קפיצה</p>
 </div>
 <div id="err"></div>
</div>

<script>
const $=i=>document.getElementById(i);
const CY=0x39d5ff,OR=0xff7a3c,r2=v=>Math.round(v*100)/100;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x2a3a5c,40,170);

cam.rotation.order='YXZ';scene.add(cam);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// sky
const skyM=new THREE.Mesh(new THREE.SphereGeometry(330,16,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{a:{value:new THREE.Color(0x0d1424)},b:{value:new THREE.Color(0x3a5282)}},
 vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 a,b;varying vec3 d;float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){float h=d.y;vec3 c=mix(b,a,smoothstep(0.,.6,h));c+=vec3(.22,.1,.04)*exp(-abs(h)*7.);vec2 g=floor(vec2(atan(d.x,d.z)*220.,h*220.));c+=vec3(step(.998,hs(g))*smoothstep(.15,.5,h));gl_FragColor=vec4(c,1.);}'}));
scene.add(skyM);
try{const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();es.add(skyM.clone());scene.environment=pm.fromScene(es,.02).texture;pm.dispose()}catch(e){}
// lights
scene.add(new THREE.HemisphereLight(0x9bb4ea,0x1a2236,.55));
const sun=new THREE.DirectionalLight(0xdfe8ff,1.15);sun.position.set(40,80,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0003;sun.shadow.normalBias=.04;
Object.assign(sun.shadow.camera,{left:-82,right:82,top:82,bottom:-82,far:260});scene.add(sun);
const rim=new THREE.DirectionalLight(0xff9a66,.3);rim.position.set(-30,20,-40);scene.add(rim);

// textures / materials (one palette)
function tex(fn,rep){const c=document.createElement('canvas');c.width=c.height=256;fn(c.getContext('2d'));
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t}
const floorT=tex(g=>{g.fillStyle='#222c44';g.fillRect(0,0,256,256);for(let i=0;i<1800;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.03})`;g.fillRect(Math.random()*256,Math.random()*256,3,3)}
 g.strokeStyle='#33436a';g.lineWidth=3;g.strokeRect(0,0,256,256)},36);
const floorM=new THREE.MeshStandardMaterial({map:floorT,roughness:.85,metalness:.1});
function dots(g,n,a){for(let i=0;i<n;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*a})`;g.fillRect(Math.random()*256,Math.random()*256,2,2)}}
const wallT=tex(g=>{g.fillStyle='#3a4870';g.fillRect(0,0,256,256);dots(g,1500,.05);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;g.strokeRect(1,1,254,254);g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.moveTo(0,128);g.lineTo(256,128);g.stroke();g.fillStyle='rgba(255,255,255,.22)';[[12,12],[244,12],[12,244],[244,244]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],4,0,7);g.fill()})},1);
const crateT=tex(g=>{g.fillStyle='#51629a';g.fillRect(0,0,256,256);dots(g,1200,.05);g.strokeStyle='#7f93cc';g.lineWidth=10;g.strokeRect(5,5,246,246);g.strokeStyle='rgba(10,16,40,.45)';g.lineWidth=8;g.beginPath();g.moveTo(14,14);g.lineTo(242,242);g.moveTo(242,14);g.lineTo(14,242);g.stroke()},1);
const wallM=new THREE.MeshStandardMaterial({map:wallT,roughness:.65,metalness:.25,envMapIntensity:.6});
const slabM=new THREE.MeshStandardMaterial({color:0x2c3756,roughness:.85,metalness:.1});
const crateM=new THREE.MeshStandardMaterial({map:crateT,roughness:.6,metalness:.3,envMapIntensity:.6});
const edgeM=new THREE.LineBasicMaterial({color:CY,transparent:true,opacity:.4});
const B=70;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(B*2,B*2),floorM);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const lane=new THREE.MeshBasicMaterial({color:CY,transparent:true,opacity:.28});
[[B*2,.25],[.25,B*2]].forEach(a=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(a[0],a[1]),lane);m.rotation.x=-Math.PI/2;m.position.y=.02;scene.add(m)});
const obst=[],solids=[];
function box(x,z,w,h,d,mat,edge=true,y0=0,stair=false){
 const geo=new THREE.BoxGeometry(w,h,d),uv=geo.attributes.uv,sc=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
 for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*sc[f][0]/4,uv.getY(i)*sc[f][1]/4)}
 const m=new THREE.Mesh(geo,mat);
 m.position.set(x,y0+h/2,z);m.castShadow=m.receiveShadow=true;
 if(edge)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),edgeM));
 scene.add(m);obst.push({x,z,hw:w/2,hd:d/2,y0,y1:y0+h,stair});solids.push(m)}
box(0,-B,B*2,7,2,wallM);box(0,B,B*2,7,2,wallM);box(-B,0,2,7,B*2,wallM);box(B,0,2,7,B*2,wallM);
const glow=new THREE.MeshBasicMaterial({color:CY});
[[0,-B+1.05,B*2,.12,.1],[0,B-1.05,B*2,.12,.1],[-B+1.05,0,.1,.12,B*2],[B-1.05,0,.1,.12,B*2]].forEach(s=>{
 const m=new THREE.Mesh(new THREE.BoxGeometry(s[2],s[3],s[4]),glow);m.position.set(s[0],5.5,s[1]);scene.add(m)});
[[14,8,4,3,4],[26,-14,4,4,4],[9,-24,10,3,1.6],[38,20,1.6,3.5,12],[0,20,8,2.4,1.6],[22,36,4,3,4],[48,-4,3,3,3],[18,-40,4,3,4],
 [-20,10,5,3,2],[-6,-12,2,3.5,6],[34,-24,6,2.4,2],[-46,8,3,3.5,3],[-28,-20,2,3,8],[56,48,4,3,4],[0,-44,10,2.4,2],[20,50,3,1.2,3],[12,-8,2,1.2,2],[-40,-10,2.5,6,2.5]].forEach(o=>{
 box(o[0],o[1],o[2],o[3],o[4],crateM);box(-o[0],-o[1],o[2],o[3],o[4],crateM)});
box(0,0,3,6,3,wallM);
// houses
const T=.4,H1=3.1,SL=.3,H2=3,OPP={N:'S',S:'N',W:'E',E:'W'},orGlow=new THREE.MeshBasicMaterial({color:OR});
function wall(cx,cz,len,ax,gaps,by=0,H=H1){
 const pts=[-len/2];gaps.forEach(g=>pts.push(g.a,g.b));pts.push(len/2);
 const put=(a,b,y0,y1)=>{const l=b-a,m=(a+b)/2;if(l<.01||y1-y0<.01)return;ax?box(cx+m,cz,l,y1-y0,T,wallM,true,y0):box(cx,cz+m,T,y1-y0,l,wallM,true,y0)};
 for(let i=0;i<pts.length;i+=2)put(pts[i],pts[i+1],by,by+H);
 gaps.forEach(g=>{put(g.a,g.b,by,by+g.y0);put(g.a,g.b,by+g.y1,by+H)})}
function house(cx,cz,w,d,side,fl=1){
 const X0=cx-w/2,X1=cx+w/2,Z0=cz-d/2,Z1=cz+d/2,opp=OPP[side];
 const low=(s,L)=>s===side?[{a:-1.3,b:1.3,y0:0,y1:2.5}]:s===opp?[{a:-1.3,b:1.3,y0:1.1,y1:2.3}]:[{a:-L*.25-1.2,b:-L*.25+1.2,y0:1.1,y1:2.3}];
 const up=L=>[{a:-L*.3-1.1,b:-L*.3+1.1,y0:1,y1:2.1},{a:L*.3-1.1,b:L*.3+1.1,y0:1,y1:2.1}];
 wall(cx,Z0,w,true,low('N',w));wall(cx,Z1,w,true,low('S',w));wall(X0,cz,d,false,low('W',d));wall(X1,cz,d,false,low('E',d));
 const gd=side==='N'?[cx,Z0,2.7,.5]:side==='S'?[cx,Z1,2.7,.5]:side==='W'?[X0,cz,.5,2.7]:[X1,cz,.5,2.7];
 const gm=new THREE.Mesh(new THREE.BoxGeometry(gd[2],.1,gd[3]),orGlow);gm.position.set(gd[0],2.55,gd[1]);scene.add(gm);
 const sx=side==='E'?-1:1;let top=H1;
 if(fl>1){
  const ox0=sx>0?X1-2.4:X0+.4,ox1=ox0+2,oz1=Z0+3.4,by=H1+SL;
  const sl=(a,b,c,e)=>box((a+b)/2,(c+e)/2,b-a,SL,e-c,slabM,true,H1);
  // Leave the entire staircase shaft open through the second-floor slab.
  // The old back slab started too early and blocked the upper/lower transition.
  sl(X0,ox0,Z0,Z1);sl(ox1,X1,Z0,Z1);
  for(let i=0;i<8;i++)box((ox0+ox1)/2,Z0+.7+.55*(7-i),2,.3875*(i+1),.55,crateM,false,0,true);
  wall(cx,Z0,w,true,up(w),by,H2);wall(cx,Z1,w,true,up(w),by,H2);wall(X0,cz,d,false,up(d),by,H2);wall(X1,cz,d,false,up(d),by,H2);
  box(cx-sx*w/4,cz+d/4,1.4,1,1.4,crateM,true,by);top=by+H2;
  const l2=new THREE.PointLight(0x9fd8ff,.8,18);l2.position.set(cx,by+2.4,cz);scene.add(l2)}
 box(cx,cz,w+.8,SL,d+.8,wallM,true,top);
 box(cx-sx*w/4,cz+d/4,1.6,1.1,1.6,crateM);
 const l=new THREE.PointLight(0x9fd8ff,.8,18);l.position.set(cx,2.6,cz);scene.add(l)}
function houseM(x,z,w,d,s,f){house(x,z,w,d,s,f);house(-x,-z,w,d,OPP[s],f)}
houseM(40,-36,12,10,'W',2);houseM(14,30,10,9,'S',1);houseM(52,30,12,10,'W',2);houseM(30,4,9,8,'N',1);
function push(p,r){const fy=p.y-1.7;for(const o of obst){
 if(o.stair)continue;
 if(fy>=o.y1||fy+1.8-.7*P.cr<=o.y0||o.y1<=fy+.55)continue;
 const dx=p.x-o.x,dz=p.z-o.z,px=o.hw+r-Math.abs(dx),pz=o.hd+r-Math.abs(dz);
 if(px>0&&pz>0){if(px<pz)p.x+=Math.sign(dx||1)*px;else p.z+=Math.sign(dz||1)*pz}}}
function groundAt(p){const fy=p.y-1.7;let g=0;for(const o of obst)if(o.y1>g&&o.y1<=fy+.55&&Math.abs(p.x-o.x)<o.hw+.25&&Math.abs(p.z-o.z)<o.hd+.25)g=o.y1;return g}
const SP=[[-62,-16],[62,16],[-62,26],[62,-26],[-36,54],[36,-54]];

// avatar
const pm=(c,e)=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.3,emissive:e||0,emissiveIntensity:.5});
const dark=new THREE.MeshStandardMaterial({color:0x10151f,roughness:.4,metalness:.5});
function limb(S,T,l1,l2,pole){
 const v=T.clone().sub(S),d=Math.min(v.length(),l1+l2-.01),n=v.normalize();
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
 const pd=pole.clone().addScaledVector(n,-pole.dot(n)).normalize();
 const E=S.clone().addScaledVector(n,a).addScaledVector(pd,h),W=S.clone().addScaledVector(n,d),dn=new THREE.Vector3(0,-1,0);
 const qu=new THREE.Quaternion().setFromUnitVectors(dn,E.clone().sub(S).normalize()),qf=new THREE.Quaternion().setFromUnitVectors(dn,W.sub(E).normalize());
 return[qu,qu.clone().invert().multiply(qf)]}
function makeAvatar(col){
 const g=new THREE.Group(),hips=new THREE.Group(),tor=new THREE.Group(),head=new THREE.Group(),aim=new THREE.Group(),R={legs:[],rec:0,ph:0,sp:0,air:0,hips,tor,head,aim};
 const suit=new THREE.MeshStandardMaterial({color:0x151b29,roughness:.75,metalness:.15}),
  plate=new THREE.MeshStandardMaterial({color:0x2d3a5c,roughness:.4,metalness:.6}),trim=new THREE.MeshBasicMaterial({color:col});
 const bx=(p,w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o};
 const cy=(p,r1,r2,h,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,10),m);o.position.set(x,y,z);p.add(o);return o};
 hips.position.y=.95;tor.position.y=.22;head.position.y=.7;aim.position.y=.28;
 g.add(hips);hips.add(tor);tor.add(head,aim);
 // pelvis + belt
 bx(hips,.5,.2,.32,suit,0,.02,0);bx(hips,.54,.06,.36,plate,0,.1,0);bx(hips,.1,.07,.03,trim,0,.1,-.19);
 // torso: abdomen, chest armor, glow strips, neck, backpack + antenna
 bx(tor,.46,.26,.3,suit,0,0,0);bx(tor,.66,.42,.4,plate,0,.33,0);bx(tor,.5,.3,.05,suit,0,.35,-.22);
 bx(tor,.36,.035,.03,trim,0,.45,-.245);bx(tor,.2,.035,.03,trim,0,.3,-.245);cy(tor,.09,.1,.12,suit,0,.57,0);
 bx(tor,.4,.46,.2,plate,0,.3,.3);bx(tor,.28,.03,.02,trim,0,.42,.41);cy(tor,.012,.012,.5,suit,.16,.62,.3);bx(tor,.04,.04,.04,trim,.16,.88,.3);
 // head: helmet, visor, chin guard, crest, ear lights
 head.add(new THREE.Mesh(new THREE.SphereGeometry(.25,18,14),plate));
 bx(head,.34,.1,.16,trim,0,.03,-.2);bx(head,.3,.1,.2,suit,0,-.17,-.1);bx(head,.06,.07,.36,suit,0,.25,.02);
 [-1,1].forEach(s=>bx(head,.05,.12,.12,trim,s*.25,0,.02));
 head.traverse(o=>{if(o.isMesh)o.userData.head=true});
 // arms (two-bone IK to the rifle grips), shoulder pads
 const L1=.32,L2=.3;
 [[1,.12,-.2,-.36],[-1,.02,-.1,-.46]].forEach(([s,tx,ty,tz])=>{
  const S=new THREE.Vector3(s*.4,.15,0),up=new THREE.Group(),el=new THREE.Group();up.position.copy(S);el.position.y=-L1;
  bx(up,.15,L1,.15,suit,0,-L1/2,0);bx(up,.26,.12,.28,plate,s*.04,.07,0);bx(up,.2,.02,.2,trim,s*.04,.135,0);
  bx(el,.13,L2,.13,plate,0,-L2/2,0);bx(el,.15,.06,.15,trim,0,0,0);bx(el,.11,.1,.13,suit,0,-L2-.03,0);up.add(el);
  const q=limb(S,new THREE.Vector3(tx,ty,tz),L1,L2,new THREE.Vector3(s*.5,-1,.35));up.quaternion.copy(q[0]);el.quaternion.copy(q[1]);aim.add(up)});
 // rifle
 if(gunTpl){const c=gunTpl.clone(true);c.rotation.y=Math.PI;c.scale.setScalar(.14);c.position.set(.12,-.03-4.5*.14,-.18);aim.add(c)}
 else bx(aim,.1,.14,.7,dark,.12,-.05,-.45);
 // legs: thigh + knee pad, shin guard, boot
 [-1,1].forEach(s=>{
  const th=new THREE.Group(),kn=new THREE.Group();th.position.x=s*.16;kn.position.y=-.47;th.add(kn);hips.add(th);
  bx(th,.2,.47,.24,suit,0,-.235,0);bx(th,.22,.26,.06,plate,0,-.2,-.13);
  bx(kn,.2,.12,.1,plate,0,0,-.13);bx(kn,.16,.025,.03,trim,0,0,-.19);
  bx(kn,.17,.4,.2,suit,0,-.2,0);bx(kn,.15,.3,.05,plate,0,-.2,-.12);
  bx(kn,.2,.16,.34,suit,0,-.4,-.06);bx(kn,.12,.03,.03,trim,0,-.36,-.235);
  R.legs.push({th,kn})});
 g.userData.rig=R;

 const vx=(p.x-R.px)/dt,vy=(p.y-R.py)/dt,vz=(p.z-R.pz)/dt,yw=avatar.rotation.y,fw=-(vx*Math.sin(yw)+vz*Math.cos(yw));

 const k=Math.min(1,dt*10);
 R.sp+=(Math.min(Math.hypot(vx,vz),9)-R.sp)*k;R.air+=((Math.abs(vy)>2?1:0)-R.air)*k;

 const sf=Math.min(1,R.sp/3.5)*(1-R.air),cr=q.cr||0,pt=q.pt||0,tc=cr*.85,ps=-Math.asin(Math.min(1,.47*Math.sin(tc)/.4));
 R.legs.forEach((l,i)=>{const a=R.ph+i*Math.PI;
  l.th.rotation.x=Math.sin(a)*.5*sf*(1-cr*.6)+tc+R.air*.5;
  l.kn.rotation.x=(ps-tc)-(.08+.9*Math.max(0,Math.cos(a)))*sf-R.air});
 R.hips.position.y=.08+.47*Math.cos(tc)+.4*Math.cos(ps)-.05*sf+Math.abs(Math.sin(R.ph))*.03*sf;

 avatar.scale.y=1-.2*cr}

   pos.addScaledVector(target.face.normal,1.05);

 }else{
   // Find the closest walkable floor at the teleport height, including second-floor slabs.
   let best=-Infinity;

 cheatSeq.push(c);if(cheatSeq.length>4)cheatSeq.shift();
 if(cheatSeq.join('')==='BHU5'){cheatSeq=[];openCheatPanel()}
}

// input
function lockMouse(){

  try{renderer.domElement.requestPointerLock()}catch(e){}

}

  $('ov').style.display='flex';

  $('ov').style.display='none';

});
addEventListener('mousemove',e=>{if(!document.pointerLockElement)return;if(Math.abs(e.movementX)>300||Math.abs(e.movementY)>300)return;const sn=keys.ads?.0013:.0022;P.yaw-=e.movementX*sn;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-e.movementY*sn))});
function clearKeys(){for(const k in keys)keys[k]=false}
addEventListener('blur',clearKeys);
addEventListener('mousedown',e=>{if(e.button===0)keys.fire=true;if(e.button===2){keys.ads=true;if(cheatUnlocked)cheatAimbot=true}});addEventListener('mouseup',e=>{if(e.button===2){keys.ads=false;cheatAimbot=false}else keys.fire=false});addEventListener('contextmenu',e=>e.preventDefault());

function reload(){if(P.reload>0||P.mag>=30||P.spare<=0)return;P.reload=1.3;beep(300,.15,'triangle',.06);setHud()}
function curSpread(){
 if(cheatUnlocked&&cheatAimbot&&avatar&&avatar.visible)return 0;
 const mv=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;
 return(.003+(mv?.013:0)+(P.ground?0:.04)+P.spread)*(keys.ads?.45:1)*(1-.4*P.cr)
}
function shoot(){
 if(P.cd>0||P.reload>0||!P.alive||phase!=='play')return;
 if(cheatUnlocked&&cheatAimbot&&avatar&&avatar.visible){
   const target=new THREE.Vector3();
   avatar.getWorldPosition(target);
   target.y+=.9;
   const from=cam.getWorldPosition(new THREE.Vector3());
   const aimDir=target.sub(from).normalize();
   P.yaw=Math.atan2(aimDir.x,aimDir.z);
   P.pitch=Math.asin(Math.max(-1,Math.min(1,aimDir.y)));
 }
 if(P.mag<=0){
   if(cheatUnlocked) P.mag=30;
   else {reload();return}
 }
 if(cheatUnlocked) P.mag=30;
 else P.mag--;
 P.cd=.095;const sp=cheatUnlocked?0:curSpread();
 P.spread=cheatUnlocked?0:Math.min(.09,P.spread+.011);
 const k=cheatUnlocked?0:(.0045+Math.random()*.002)*(1-.3*P.cr);
 P.pitch+=k;P.kick+=k;
 if(!cheatUnlocked)P.yaw+=(Math.random()-.5)*.005*(1+P.spread*25);
 gunKick=.07;flash.intensity=2.5;fm.visible=true;setTimeout(()=>{flash.intensity=0;fm.visible=false},45);beep(170,.12,'sawtooth',.1,60);
 cam.updateMatrixWorld();gun.updateMatrixWorld(true);
 let dir;
 if(cheatUnlocked&&cheatAimbot&&avatar&&avatar.visible){
   const target=new THREE.Vector3();avatar.getWorldPosition(target);target.y+=.9;
   const from=cam.getWorldPosition(new THREE.Vector3());
   dir=target.sub(from).normalize();
 }else if(cheatUnlocked){
   dir=new THREE.Vector3(0,0,-1).transformDirection(cam.matrixWorld).normalize();
 }else{
   const a=Math.random()*6.283,rr=Math.sqrt(Math.random())*Math.tan(sp);
   dir=new THREE.Vector3(Math.cos(a)*rr,Math.sin(a)*rr,-1).normalize().transformDirection(cam.matrixWorld);
 }
 const tg=solids.slice();if(avatar&&avatar.visible)tg.push(avatar);
 let p=cam.getWorldPosition(new THREE.Vector3()),o0=p.clone(),vel=dir.clone().multiplyScalar(85),h=null,end=null;const pts=[p.clone()];
 for(let i=0;i<48&&!end;i++){const np=p.clone().addScaledVector(vel,.025);
  const sg=np.clone().sub(p),L=sg.length();ray.set(p,sg.normalize());ray.far=L;
  h=ray.intersectObjects(tg,true).find(x=>x.object.isMesh)||null;
  if(h)end=h.point.clone();
  else if(np.y<=0&&p.y>0){end=p.clone().lerp(np,p.y/(p.y-np.y))}
  else{p=np;pts.push(np.clone())}}
 ray.far=Infinity;if(!end)end=p.clone();pts.push(end.clone());
 if(h){if(h.object.userData.opp){const hs=h.object.userData.head;P.dealt+=hs?34:13;blood(h.point,hs?34:20);
   $('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),90);beep(hs?950:520,.06,'sine',.08)}
  else spark(h.point,CY,5)}
 const mz=gun.localToWorld(MZ.clone()),ed=o0.distanceTo(end);
 pts[0]=ed<mz.distanceTo(o0)+.3?o0.clone().addScaledVector(dir,Math.min(.3,ed*.5)):mz;tracer(pts[0],end,myCol(),pts);
 P.shots++;P.ex=end.x;P.ey=end.y;P.ez=end.z;setHud()}

// loop
const clock=new THREE.Clock(),tmp=new THREE.Vector3();
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,o=getOpp(),q=o&&o.presence;
 const crch=(keys.ControlLeft||keys.ControlRight||keys.KeyC)&&P.alive;P.cr+=((crch?1:0)-P.cr)*Math.min(1,dt*12);
 if(phase==='lobby'&&q){
  if(isHost&&q.x!==undefined||isHost&&o){go=1;room.presence({go:1});begin()}
  else if(!isHost&&q.host&&q.go)begin()}
 if(phase==='count'){cdT-=dt;$('big').textContent=cdT>0?Math.ceil(cdT):'';if(cdT<=0){phase='play';$('big').textContent='GO!';setTimeout(()=>{if(phase==='play')$('big').textContent=''},700)}}
 if(avatar&&q&&q.x!==undefined){
  avatar.visible=q.alive==1&&(phase==='play'||phase==='count');
  tgt.set(q.x,q.y-1.7,q.z);avatar.position.lerp(tgt,Math.min(1,dt*18));avatar.rotation.y=q.yaw;animAvatar(dt,q);
  if(lastShots<0)lastShots=q.shots|0;
  if(q.shots>lastShots){lastShots=q.shots;avatar.userData.rig.rec=1;tracer(new THREE.Vector3(q.x,q.y-.45,q.z),new THREE.Vector3(q.ex,q.ey,q.ez),isHost?OR:CY);beep(140,.1,'square',.05,70)}
  if(q.dealt<lastDealt)lastDealt=q.dealt;
  if(q.dealt>lastDealt){const d=q.dealt-lastDealt;lastDealt=q.dealt;if(P.alive&&phase==='play')hurt(d)}
  const mk=q.deaths|0;$('me').textContent=mk;$('op').textContent=P.deaths;
  if(phase==='play'){if(mk>=10)over(true);else if(P.deaths>=10)over(false)}}
 else if(avatar&&phase==='play'&&!q&&room){phase='over';over(true);$('body').insertAdjacentHTML('afterbegin','<p>היריב התנתק.</p>')}
 cheatAim();updateCheatESP();
 if(phase==='play'||phase==='count'){
  if(phase==='play'&&P.alive){
   const sp=(crch?2.6:keys.ads?3.3:(cheatUnlocked&&keys.ShiftLeft?13:keys.ShiftLeft?9:5.5))*dt;let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
   if(mx||mz){const l=Math.hypot(mx,mz);mx/=l;mz/=l;P.pos.x+=(Math.cos(P.yaw)*mx+Math.sin(P.yaw)*mz)*sp;P.pos.z+=(-Math.sin(P.yaw)*mx+Math.cos(P.yaw)*mz)*sp}
   if(keys.Space&&P.ground&&!crch){P.vy=7;P.ground=false}
   P.cd-=dt;if(P.reload>0){P.reload-=dt;if(P.reload<=0){P.mag=30;P.spare--;P.reload=0;setHud()}}
   if(!keys.fire){P.spread=Math.max(0,P.spread-dt*.14);const rc=Math.min(P.kick,dt*.25);P.pitch-=rc;P.kick-=rc}
   if(keys.fire)shoot()}
  const gh=groundAt(P.pos)+1.7;P.vy-=20*dt;P.pos.y+=P.vy*dt;if(P.pos.y<=gh){P.pos.y=gh;P.vy=0;P.ground=true}else if(P.pos.y>gh+.15)P.ground=false;
  push(P.pos,.5);
  if(q&&q.x!==undefined&&q.alive==1&&P.alive&&Math.abs(P.pos.y-q.y)<1.7){const dx=P.pos.x-q.x,dz=P.pos.z-q.z,d=Math.hypot(dx,dz);
   if(d<.9){if(d>.001){P.pos.x+=dx/d*(.9-d);P.pos.z+=dz/d*(.9-d)}else P.pos.x+=.9;push(P.pos,.5)}}
  P.pos.x=Math.max(-B+2,Math.min(B-2,P.pos.x));P.pos.z=Math.max(-B+2,Math.min(B-2,P.pos.z))}
 if(room&&phase!=='menu')room.presence({x:r2(P.pos.x),y:r2(P.pos.y),z:r2(P.pos.z),yaw:r2(P.yaw),hp:P.hp,dealt:P.dealt,deaths:P.deaths,shots:P.shots,ex:r2(P.ex),ey:r2(P.ey),ez:r2(P.ez),alive:P.alive?1:0,cr:r2(P.cr),pt:r2(P.pitch),host:isHost?1:0,go});
 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.t-=dt;if(p.line)p.m.material.opacity=p.t/.22;else{p.v.y-=9*dt;p.m.position.addScaledVector(p.v,dt)}
  if(p.t<=0){scene.remove(p.m);fx.splice(i,1)}}
 gunKick=Math.max(0,gunKick-dt*.8);
 const ad=keys.ads&&P.reload<=0,mvv=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;
 gun.position.x+=((ad?0:.26)-gun.position.x)*12*dt;
 gun.position.y+=((ad?-.22:-.24)-(P.reload>0?.18:0)+(mvv&&!ad?Math.sin(t*9)*.008:0)-gun.position.y)*12*dt;
 {const wd=new THREE.Vector3(-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch));
  wray.set(new THREE.Vector3(P.pos.x,camY,P.pos.z),wd);wray.far=1.2;const wh=wray.intersectObjects(solids,false)[0];
  wallPull+=((wh?Math.max(0,.95-wh.distance):0)-wallPull)*Math.min(1,dt*20)}
 gun.position.z=(ad?-.4:-.5)+gunKick+wallPull;gun.rotation.x=P.reload>0?-.6:gunKick*1.5;
 const tf=ad?58:78;if(Math.abs(cam.fov-tf)>.1){cam.fov+=(tf-cam.fov)*12*dt;cam.updateProjectionMatrix()}
 shake=Math.max(0,shake-dt);
 camY+=(P.pos.y-camY)*Math.min(1,dt*22);cam.position.copy(P.pos);cam.position.y=camY;cam.position.y-=(P.alive?0:1.1)+.7*P.cr;cam.position.x+=(Math.random()-.5)*shake*.3;
 P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch));if(!isFinite(P.yaw))P.yaw=0;
 cam.rotation.set(P.pitch,P.yaw,P.alive?0:.6);
 $('cross').style.transform='translate(-50%,-50%) scale('+(1+curSpread()*45).toFixed(2)+')';
 renderer.render(scene,cam)}
spawn();loop();
$('bh').onclick=hostGame;$('bj').onclick=joinGame;
